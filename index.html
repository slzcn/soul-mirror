<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="description" content="灵魂镜像 · 测测你最像哪个历史人物 · 15道沉浸式叙事场景题 · 12位历史人物维度画像 · 余弦相似度命运匹配 · SVG命运雷达图">
<title>灵魂镜像 · 测测你最像哪个历史人物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
:root{
  --bg:#0a0a14; --bg2:#12121e; --gold:#d4af37; --gold-dim:#8a7028; --amber:#c8983e;
  --red:#8b2233; --indigo:#4a5a8a; --text:#e8e2d0; --text-dim:#8a8478; --card:#181828;
  --accent:#d4af37; --accent-dim:#8a7028; --accent-glow:rgba(212,175,55,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif SC','Georgia','Songti SC','SimSun',serif;line-height:1.7;overflow-x:hidden;min-height:100vh}
.hidden{display:none!important}

/* 星空背景：不拦截点击 */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0.25}50%{opacity:1}}

/* 屏幕：默认隐藏，加 .active 显示并淡入 */
.screen{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;align-items:center;padding:20px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
.screen.active{display:flex;animation:screenIn 0.45s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 通用按钮 */
.btn,.option,.share-btn,.browse-chip{-webkit-appearance:none;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:14px 36px;font-size:1.05rem;font-family:inherit;letter-spacing:0.1em;cursor:pointer;border-radius:2px;transition:transform 0.25s,background 0.3s,color 0.3s,box-shadow 0.3s;font-weight:bold}
.btn:hover{background:var(--accent);color:var(--bg);box-shadow:0 0 24px var(--accent-glow);transform:translateY(-2px)}
.btn:active{background:var(--accent);color:var(--bg);transform:translateY(0)}
.btn-secondary{border-color:var(--text-dim);color:var(--text-dim)}
.btn-secondary:hover{background:var(--text-dim);color:var(--bg);box-shadow:0 0 18px rgba(138,132,120,0.3)}
.btn-secondary:active{background:var(--text-dim);color:var(--bg)}

/* Cover */
#cover{justify-content:center;text-align:center}
.cover-title{font-size:clamp(2rem,9vw,2.6rem);font-weight:700;color:var(--gold);letter-spacing:0.12em;margin-bottom:8px;text-shadow:0 0 30px rgba(212,175,55,0.4);word-break:keep-all;overflow-wrap:break-word}
.cover-sub{font-size:1rem;color:var(--text-dim);margin-bottom:40px;letter-spacing:0.1em}
.typewriter{min-height:120px;font-size:0.95rem;color:var(--text);max-width:380px;margin:0 auto 40px;text-align:left;line-height:2;opacity:0;transition:opacity 0.3s}
.typewriter.show{opacity:1}
.cursor{color:var(--gold);animation:blink 0.8s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.start-btn{opacity:0;transition:opacity 0.5s}
.start-btn.show{opacity:1}

/* Quiz */
#quiz{}
.progress-wrap{width:100%;max-width:460px;margin-bottom:32px}
.progress-bar{height:3px;background:var(--bg2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));width:0;transition:width 0.4s ease;border-radius:2px;position:relative;overflow:hidden}
.progress-fill::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);transform:translateX(-100%);animation:shimmer 1.8s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.progress-text{font-size:0.75rem;color:var(--text-dim);text-align:center;margin-top:8px;letter-spacing:0.1em}
.quiz-layout{width:100%;max-width:460px}
.q-icon{font-size:2.2rem;margin-bottom:12px;text-align:center;filter:grayscale(0.2) opacity(0.9)}
.q-intro{font-style:italic;color:var(--text-dim);font-size:0.88rem;text-align:center;max-width:420px;margin:0 auto 28px;line-height:2;padding:0 12px}
.options{width:100%;display:flex;flex-direction:column;gap:12px}
.option{background:rgba(24,24,40,0.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid #2a2a3e;color:var(--text);padding:18px 20px;font-family:inherit;font-size:0.92rem;line-height:1.8;cursor:pointer;border-radius:4px;transition:border-color 0.25s,background 0.25s,box-shadow 0.25s,transform 0.25s;text-align:left;position:relative;overflow:hidden}
.option::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform 0.25s}
.option:hover{border-color:var(--accent);background:rgba(30,30,50,0.7);transform:translateY(-1px)}
.option:active{border-color:var(--accent);background:rgba(30,30,50,0.7)}
.option:hover::before,.option:active::before{transform:scaleY(1)}
.option.selected{border-color:var(--accent);background:rgba(30,30,50,0.78);box-shadow:0 0 15px var(--accent-glow)}
.option.selected::before{transform:scaleY(1)}
.q-transition{animation:qFadeIn 0.4s ease}
@keyframes qFadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* Loading */
#loading{justify-content:center}
.load-symbol{width:80px;height:80px;margin-bottom:24px;position:relative}
.load-ring{position:absolute;width:100%;height:100%;border:2px solid transparent;border-top-color:var(--accent);border-radius:50%;animation:spin 1.2s linear infinite}
.load-ring:nth-child(2){border-top-color:transparent;border-bottom-color:var(--accent-dim);animation-duration:1.8s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{color:var(--accent);font-size:1.1rem;letter-spacing:0.2em;text-align:center;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
.load-fragment{margin-top:16px;max-width:340px;font-size:0.82rem;color:var(--text-dim);font-style:italic;text-align:center;line-height:1.8;opacity:0;animation:fadeIn 0.6s ease 0.3s forwards}

/* Result */
#result{}
.result-name{font-size:clamp(2.2rem,9vw,3rem);font-weight:700;color:var(--accent);text-align:center;letter-spacing:0.1em;margin-bottom:4px;animation:nameZoom 0.8s ease;text-shadow:0 0 30px var(--accent-glow);word-break:break-word;overflow-wrap:break-word}
@keyframes nameZoom{from{opacity:0;transform:scale(0.5);letter-spacing:0.5em}to{opacity:1;transform:scale(1);letter-spacing:0.1em}}
.result-title-sub{color:var(--text-dim);font-size:0.85rem;text-align:center;letter-spacing:0.15em;margin-bottom:8px;opacity:0;animation:fadeIn 0.6s ease 0.4s forwards}
.result-tagline{font-size:1.1rem;color:var(--text);text-align:center;margin-bottom:32px;font-style:italic;opacity:0;animation:fadeIn 0.6s ease 0.6s forwards;max-width:400px}
@keyframes fadeIn{to{opacity:1}}
.result-main{width:100%;display:flex;flex-direction:column;align-items:center}
.radar-wrap{display:flex;justify-content:center;margin-bottom:32px;opacity:0;animation:fadeIn 0.8s ease 0.8s forwards;width:100%}
.radar-svg{width:100%;max-width:320px;height:auto}
.radar-grid{fill:none;stroke:#2a2a3e;stroke-width:1}
.radar-axis{stroke:#2a2a3e;stroke-width:1}
.radar-user{fill:var(--accent);fill-opacity:0.15;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar-char{fill:none;stroke:var(--text-dim);stroke-width:1.5;stroke-dasharray:4 3;stroke-linejoin:round}
.radar-label{fill:var(--text-dim);font-size:11px;text-anchor:middle;dominant-baseline:middle}
.radar-dot-user{fill:var(--accent)}
.radar-dot-char{fill:var(--text-dim)}
.compare-col{width:100%;max-width:460px}
.compare{width:100%;margin-bottom:32px;opacity:0;animation:fadeIn 0.8s ease 1.2s forwards}
.compare-title{font-size:0.9rem;color:var(--accent);letter-spacing:0.1em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bg2)}
.compare-list{list-style:none;font-size:0.88rem;line-height:2;color:var(--text)}
.compare-list li{padding-left:18px;position:relative}
.compare-list li::before{content:'';position:absolute;left:0;top:50%;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateY(-50%)}
.compare-diff .compare-list li::before{background:var(--text-dim)}
.timeline{width:100%;max-width:460px;margin-bottom:32px;opacity:0;animation:fadeIn 0.8s ease 1.4s forwards}
.timeline-title{font-size:0.9rem;color:var(--accent);letter-spacing:0.1em;margin-bottom:16px;padding-bottom:6px;border-bottom:1px solid var(--bg2)}
.timeline-item{display:flex;gap:14px;margin-bottom:20px}
.timeline-marker{flex-shrink:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--bg);margin-top:4px;box-shadow:0 0 8px var(--accent-glow)}
.timeline-body{font-size:0.85rem;line-height:1.9}
.timeline-event{color:var(--accent);font-weight:bold;margin-bottom:2px;font-size:0.82rem}
.share-box{width:100%;max-width:460px;background:rgba(24,24,40,0.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid #2a2a3e;border-radius:4px;padding:16px;margin-bottom:24px;opacity:0;animation:fadeIn 0.8s ease 1.6s forwards}
.share-text{font-size:0.85rem;color:var(--text);line-height:1.8;margin-bottom:12px}
.share-btn{background:transparent;border:1px solid var(--accent-dim);color:var(--accent);padding:8px 20px;font-size:0.82rem;font-family:inherit;cursor:pointer;border-radius:2px;transition:background 0.2s,color 0.2s;letter-spacing:0.05em}
.share-btn:hover{background:var(--accent-dim);color:var(--bg)}
.result-btns{display:flex;gap:12px;opacity:0;animation:fadeIn 0.8s ease 1.8s forwards;flex-wrap:wrap;justify-content:center;width:100%;max-width:460px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 24px;border-radius:4px;font-size:0.85rem;z-index:1000;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
.browse-list{width:100%;max-width:460px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.browse-chip{background:rgba(24,24,40,0.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid #2a2a3e;color:var(--text-dim);padding:6px 14px;font-size:0.78rem;font-family:inherit;cursor:pointer;border-radius:2px;transition:border-color 0.2s,color 0.2s}
.browse-chip:hover{border-color:var(--accent);color:var(--accent)}
.browse-back{margin-top:20px}

/* 平板 481-899px */
@media(min-width:481px){
  .quiz-layout,.progress-wrap,.compare-col,.timeline,.share-box,.result-btns,.browse-list{max-width:560px}
  .options{gap:14px;max-width:560px}
  .cover-title{letter-spacing:0.14em}
}

/* PC ≥900px */
@media(min-width:900px){
  .cover-title{font-size:4rem;letter-spacing:0.16em}
  .cover-sub{font-size:1.1rem;margin-bottom:48px}
  .typewriter{max-width:560px;font-size:1rem}
  .start-btn{padding:16px 48px;font-size:1.15rem}
  .quiz-layout{max-width:840px}
  .quiz-grid{display:grid;grid-template-columns:35% 65%;gap:32px;align-items:start}
  .quiz-grid .q-side{text-align:center;padding-top:8px}
  .quiz-grid .q-side .q-intro{max-width:none;margin:0 0 0}
  .quiz-grid .options{max-width:none}
  .option{font-size:1rem;padding:20px 24px}
  .progress-wrap{max-width:840px}
  .result-main{flex-direction:row;align-items:flex-start;justify-content:center;gap:40px;max-width:840px}
  .result-main .radar-wrap{flex:0 0 320px;margin-bottom:0;max-width:320px}
  .result-main .compare-col{flex:1;max-width:420px}
  .timeline{max-width:840px}
  .share-box,.result-btns,.browse-list{max-width:840px}
  .result-name{font-size:4rem}
  .result-tagline{font-size:1.2rem;max-width:560px}
}

/* 极小屏 ≤360px */
@media(max-width:360px){
  .cover-title{font-size:1.95rem;letter-spacing:0.08em}
  .option{font-size:0.85rem;padding:15px 16px}
  .q-intro{font-size:0.82rem;padding:0 4px}
  .result-name{font-size:2rem}
}

@media(min-width:520px){.cover-title{font-size:3.2rem}.result-name{font-size:3.6rem}.q-intro{font-size:0.95rem}.option{font-size:1rem}}
</style>
</head>
<body>
<svg id="stars" xmlns="http://www.w3.org/2000/svg"></svg>

<div id="cover" class="screen active">
  <h1 class="cover-title">灵魂镜像</h1>
  <div class="cover-sub">测测你最像哪个历史人物</div>
  <div class="typewriter" id="typewriter"></div>
  <button class="btn start-btn" id="startBtn" onclick="startQuiz()">开始测试</button>
</div>

<div id="quiz" class="screen">
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div id="quizContent" class="q-transition"></div>
</div>

<div id="loading" class="screen">
  <div class="load-symbol"><div class="load-ring"></div><div class="load-ring"></div></div>
  <div class="load-text">命运推演中…</div>
  <div class="load-fragment" id="loadFragment"></div>
</div>

<div id="result" class="screen">
  <div id="resultContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// === 维度定义 ===
var DIMS = ['权力欲','理性度','孤独感','变革性','情感深度'];

// === 12位历史人物画像 ===
// 维度顺序: [权力欲, 理性度, 孤独感, 变革性, 情感深度]
var FIGURES = [
  {name:'李白',title:'浪漫诗仙',tagline:'醉眼看人间，诗剑舞天涯',
   vec:[-2,-2,1,1,2],color:'#4a6fa5',accentName:'靛蓝',
   timeline:[
     {event:'少年出蜀',text:'仗剑去国，辞亲远游，一叶扁舟沿长江而下。从此天下有了李太白。'},
     {event:'长安醉卧',text:'天子呼来不上船，自称臣是酒中仙。贺知章见他，惊呼"谪仙人"。'},
     {event:'轻舟已过',text:'流放夜郎途中遇赦。他写下"轻舟已过万重山"——那个出蜀少年终于回来了。'}
   ]},
  {name:'武则天',title:'千古女帝',tagline:'日月凌空，万物臣服',
   vec:[2,2,2,2,-1],color:'#a02040',accentName:'深红',
   timeline:[
     {event:'入宫为才人',text:'十四岁入太宗后宫，被赐号"武媚"。驯狮子骢的故事里，已见帝王心性。'},
     {event:'改唐为周',text:'六十七岁称帝，改国号为周。以一介女身坐上龙椅，前无古人。'},
     {event:'无字之碑',text:'临终去帝号，以皇后身份入葬乾陵。立无字碑，功过留给后人评说。'}
   ]},
  {name:'达芬奇',title:'全能天才',tagline:'万物皆可解，唯有好奇不息',
   vec:[0,2,1,1,1],color:'#c8983e',accentName:'琥珀',
   timeline:[
     {event:'画室学艺',text:'少年入韦罗基奥画室。他画的天使比师父还好，师父从此搁笔。'},
     {event:'米兰十七年',text:'给米兰公爵写信求职——"我能造桥、造炮、造城防"。在米兰画下《最后的晚餐》。'},
     {event:'手稿如海',text:'留下六千页手稿，从飞行器到人体解剖，每一个领域都走到了人类智力的尽头。'}
   ]},
  {name:'苏格拉底',title:'诘问哲人',tagline:'唯有审视过的人生值得过',
   vec:[-1,2,1,1,0],color:'#d4af37',accentName:'金色',
   timeline:[
     {event:'德尔斐神谕',text:'神说他是雅典最聪明的人。他困惑，于是开始一一走访"智者"，发现他们自以为知。'},
     {event:'街头诘问',text:'在雅典街头追问每一个行人，用不断追问击碎所有人的虚假认知。'},
     {event:'饮鸩而死',text:'被判"腐蚀青年"之罪。拒绝逃跑，平静饮下毒堇汁，用死亡完成了最后一课。'}
   ]},
  {name:'尼采',title:'超人先知',tagline:'那些没杀死我的，使我更强',
   vec:[1,2,2,2,2],color:'#7a3a8a',accentName:'深紫',
   timeline:[
     {event:'墓园少年',text:'父亲早逝，少年在墓园和音乐中度过。十岁开始写诗，内心已有一个深渊。'},
     {event:'都灵崩溃',text:'在都灵街头看到马被鞭打，抱住马痛哭。从此精神崩溃，余生十一年在黑暗中度过。'},
     {event:'超人宣言',text:'写下"上帝已死"与超人哲学。生前无人理解，死后照亮了整个二十世纪。'}
   ]},
  {name:'克利奥帕特拉',title:'尼罗河蛇后',tagline:'以美为刃，以智为盾',
   vec:[2,1,1,1,2],color:'#b8860b',accentName:'金红',
   timeline:[
     {event:'卷毯见凯撒',text:'被弟弟逐出埃及，她把自己卷在地毯里送到凯撒面前——一场赌命的自我推销。'},
     {event:'与安东尼',text:'凯撒死后她选择了安东尼。两人的联盟几乎重塑了整个地中海的版图。'},
     {event:'毒蛇之吻',text:'亚克兴海战败后，她选择用毒蛇结束自己。埃及从此成为罗马的一个行省。'}
   ]},
  {name:'成吉思汗',title:'草原之王',tagline:'最大的快乐，在于征服敌人',
   vec:[2,1,-1,1,-2],color:'#3a6a4a',accentName:'暗绿',
   timeline:[
     {event:'少年劫难',text:'父亲被毒死，部落抛弃了孤儿寡母。少年在草原上挖草根活下来，学到只有强者才能生存。'},
     {event:'统一蒙古',text:'用二十年时间，将散落的草原部落一一收入麾下，被推为"成吉思汗"。'},
     {event:'西征花剌子模',text:'使者被杀，他率军西征，一路摧毁城池。蒙古铁骑踏出了横跨欧亚的帝国。'}
   ]},
  {name:'曹操',title:'乱世枭雄',tagline:'宁我负人，毋人负我',
   vec:[2,2,1,1,0],color:'#8b7515',accentName:'暗金',
   timeline:[
     {event:'刺董未遂',text:'年轻时任侠放荡，曾持刀刺董卓，失败后逃亡。刺杀虽败，但天下皆知此名。'},
     {event:'挟天子令诸侯',text:'迎汉献帝于许昌，"奉天子以令不臣"，从此以中央之名行霸主之实。'},
     {event:'赤壁之败',text:'南下统一，却在赤壁遇周瑜一把火。统一大业功亏一篑，但北方基业已稳。'}
   ]},
  {name:'诸葛亮',title:'卧龙先生',tagline:'鞠躬尽瘁，死而后已',
   vec:[1,2,2,-1,1],color:'#3a8068',accentName:'翠青',
   timeline:[

function selectOption(idx){
  var opts=document.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('selected');

  var sc=QUESTIONS[currentQ].options[idx].scores;
  for(var i=0;i<5;i++) userVec[i]+=sc[i];
  setTimeout(function(){
    currentQ++;
    if(currentQ>=QUESTIONS.length){
      document.getElementById('progressFill').style.width='100%';
      showLoading();
    }else{
      showQuestion();
    }
  },350);
}

// === 余弦相似度 ===
function cosineSim(a,b){
  var dot=0,mA=0,mB=0;
  for(var i=0;i<a.length;i++){dot+=a[i]*b[i];mA+=a[i]*a[i];mB+=b[i]*b[i];}
  mA=Math.sqrt(mA); mB=Math.sqrt(mB);
  if(mA===0||mB===0) return 0;
  return dot/(mA*mB);
}

function computeResult(){
  var best=-1,bestIdx=0;
  for(var i=0;i<FIGURES.length;i++){
    var s=cosineSim(userVec,FIGURES[i].vec);
    if(s>best){best=s;bestIdx=i;}
  }
  return bestIdx;
}

// === SVG雷达图 ===
function drawRadar(userVec,charVec){
  var cx=150,cy=150,maxR=110;
  var n=5,angles=[];
  for(var i=0;i<n;i++) angles.push(-Math.PI/2+i*2*Math.PI/n);
  var html='<svg class="radar-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">';
  // grid
  for(var ring=1;ring<=4;ring++){
    var r=maxR*ring/4;
    var pts='';
    for(var i=0;i<n;i++){
      var x=cx+Math.cos(angles[i])*r, y=cy+Math.sin(angles[i])*r;
      pts+=x+','+y+' ';
    }
    html+='<polygon class="radar-grid" points="'+pts+'"/>';
  }
  // axes
  for(var i=0;i<n;i++){
    var x=cx+Math.cos(angles[i])*maxR, y=cy+Math.sin(angles[i])*maxR;
    html+='<line class="radar-axis" x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'"/>';
  }
  // char polygon (dashed)
  var cp='';
  for(var i=0;i<n;i++){
    var val=(charVec[i]+2)/4; // -2..2 -> 0..1
    var r=maxR*val;
    var x=cx+Math.cos(angles[i])*r, y=cy+Math.sin(angles[i])*r;
    cp+=x+','+y+' ';
  }
  html+='<polygon class="radar-char" points="'+cp+'"/>';
  // user polygon
  var up='';
  for(var i=0;i<n;i++){
    var val=(userVec[i]+2)/4;
    var r=maxR*Math.max(0,Math.min(1,val));
    var x=cx+Math.cos(angles[i])*r, y=cy+Math.sin(angles[i])*r;
    up+=x+','+y+' ';
    html+='<circle class="radar-dot-user" cx="'+x+'" cy="'+y+'" r="3"/>';
  }
  html+='<polygon class="radar-user" points="'+up+'"/>';
  // dots for char
  for(var i=0;i<n;i++){
    var val=(charVec[i]+2)/4;
    var r=maxR*val;
    var x=cx+Math.cos(angles[i])*r, y=cy+Math.sin(angles[i])*r;
    html+='<circle class="radar-dot-char" cx="'+x+'" cy="'+y+'" r="2.5"/>';
  }
  // labels
  var labels=['权力','理性','孤独','变革','情感'];
  for(var i=0;i<n;i++){
    var x=cx+Math.cos(angles[i])*(maxR+22), y=cy+Math.sin(angles[i])*(maxR+22);
    html+='<text class="radar-label" x="'+x+'" y="'+y+'">'+labels[i]+'</text>';
  }
  html+='</svg>';
  return html;
}

    var d=Math.abs(uVec[i]-cVec[i]);
    if(d<=1) sim.push(DIMS[i]+'：你与'+FIGURES[currentFigure].name+'在此维度上几乎重合（'+formatVal(uVec[i])+' vs '+formatVal(cVec[i])+'）');
    else diff.push(DIMS[i]+'：你'+formatVal(uVec[i])+'，而'+FIGURES[currentFigure].name+'是'+formatVal(cVec[i])+'——这是你们灵魂的裂缝');
  }
  if(sim.length===0) sim.push('你与'+FIGURES[currentFigure].name+'在每个维度都有微妙的不同，但正是这些不同拼出了命中注定的相遇');
  if(diff.length===0) diff.push('你们几乎是一面镜子的两面，那些细微的不同恰恰证明了你的独特');
  return{sim:sim,diff:diff};
}
function formatVal(v){
  if(v>=2) return'极强'; if(v===1) return'偏高'; if(v===0) return'中性';
  if(v===-1) return'偏低'; return'极弱';
}

var currentFigure=0;
function showResult(){
  showScreen('result');
  var idx=computeResult();
  renderResult(idx);
}
function renderResult(idx){
  currentFigure=idx;
  var f=FIGURES[idx];
  document.documentElement.style.setProperty('--accent',f.color);
  // 人物动态发光色
  var glow=f.color+'66';
  document.documentElement.style.setProperty('--accent-glow',glow);
  var cmp=genCompare(userVec,f.vec);
  var radarHtml=drawRadar(userVec,f.vec);
  var simHtml=cmp.sim.map(function(s){return'<li>'+s+'</li>'}).join('');
  var diffHtml=cmp.diff.map(function(s){return'<li>'+s+'</li>'}).join('');
  var tlHtml=f.timeline.map(function(t){
    return'<div class="timeline-item"><div class="timeline-marker"></div><div class="timeline-body"><div class="timeline-event">'+t.event+'</div>'+t.text+'</div></div>';
  }).join('');
  var shareText='我测出来是'+f.name+'——'+f.tagline+'。你是谁？';
  var html='<div class="result-name" style="text-shadow:0 0 30px '+glow+', 0 0 60px '+f.color+'33">'+f.name+'</div>'+
    '<div class="result-title-sub">'+f.title+' · '+f.accentName+'</div>'+
    '<div class="result-tagline">「'+f.tagline+'」</div>'+
    '<div class="result-main">'+
      '<div class="radar-wrap">'+radarHtml+'</div>'+
      '<div class="compare-col">'+
        '<div class="compare"><div class="compare-title">你们的相似之处</div><ul class="compare-list">'+simHtml+'</ul></div>'+
        '<div class="compare compare-diff"><div class="compare-title" style="color:var(--text-dim)">你们的不同之处</div><ul class="compare-list" style="color:var(--text-dim)">'+diffHtml+'</ul></div>'+
      '</div>'+
    '</div>'+
    '<div class="timeline"><div class="timeline-title">命运时间线 · '+f.name+'的三个转折</div>'+tlHtml+'</div>'+
    '<div class="share-box"><div class="share-text" id="shareText">'+shareText+'</div><button class="share-btn" id="shareBtn" onclick="copyShare(this)">复制分享文案</button></div>'+
    '<div class="result-btns"><button class="btn" onclick="restart()">再测一次</button><button class="btn btn-secondary" onclick="toggleBrowse()">看看其他人物</button></div>'+
    '<div class="browse-list hidden" id="browseList">'+genBrowseChips()+'</div>';
  document.getElementById('resultContent').innerHTML=html;
}

function genBrowseChips(){
  var html='';
  for(var i=0;i<FIGURES.length;i++){
    if(i===currentFigure) continue;
    html+='<button class="browse-chip" onclick="browseFigure('+i+')">'+FIGURES[i].name+'</button>';
  }
  return html;
}
function toggleBrowse(){
  var el=document.getElementById('browseList');
  el.classList.toggle('hidden');
}
function browseFigure(idx){
  var f=FIGURES[idx];
  currentFigure=idx;
  document.documentElement.style.setProperty('--accent',f.color);
  document.documentElement.style.setProperty('--accent-glow',f.color+'66');
  renderResult(idx);
}

function copyShare(btn){
  var text=document.getElementById('shareText').textContent;
  var done=function(){
    if(btn){var orig=btn.textContent;btn.textContent='✓ 已复制';btn.disabled=true;
      setTimeout(function(){btn.textContent=orig;btn.disabled=false},1500)}
    showToast('已复制到剪贴板');
  };
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text,done)});
  }else{fallbackCopy(text,done);}
}
function fallbackCopy(text,cb){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');if(cb){cb()}else{showToast('已复制到剪贴板')}}catch(e){showToast('复制失败，请手动复制')}
  document.body.removeChild(ta);
}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.remove('show')},2000);
}
function restart(){
  currentQ=0; userVec=[0,0,0,0,0];
  document.documentElement.style.setProperty('--accent','#d4af37');
  document.documentElement.style.setProperty('--accent-glow','rgba(212,175,55,0.3)');
  showScreen('cover');
  typeIdx=0;
  typeWriter();
}
</script>
